<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link href="./style.css" rel="stylesheet" type="text/css" media="all">
    <link href="./styleUI.css" rel="stylesheet" type="text/css" media="all">
    <link href="./styleMobs.css" rel="stylesheet" type="text/css" media="all">
    <link href="./model1Anim.css" rel="stylesheet" type="text/css" media="all">
    <link href="./model2Anim.css" rel="stylesheet" type="text/css" media="all">
    <script src="./playerMovement.js"></script>
    <script src="./foliage.js"></script>
    <script type="module" src="game.js"></script
  </head>
  <body>
    <h2>Your ID: <span id="my-id">Loading...</span></h2>
    <p>Share this code with your friend!</p>
    <hr>
    <h2>Connect to a Friend</h2>
    <input type="text" id="friend-id-input" placeholder="Enter friend's ID here">
    <button id="connect-btn">Connect</button>
    <hr>
    <h3>Status: <span id="status">Disconnected</span></h3>
    <div id="chat-box"></div>
  
    <div id="world">
      <div id="player">
        <div id="hpBar">
          <div id="hp"></div>
        </div>
        <div id="collisionBox"></div>
      </div>
      <div class="dummy">
        <div class="hpBar">
          <div class="hp"></div>
        </div>
        <div class="collisionBox"></div>
      </div>
    </div>
  </body>
</html>
